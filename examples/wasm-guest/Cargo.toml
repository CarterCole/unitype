[package]
name = "unitype-wasm-guest"
version = "0.1.0"
edition = "2024"
description = "A proof compiled to WebAssembly, showing what a guest has to export."
publish = false

# Deliberately its own workspace: this is built for a different target, and a
# `cargo build` at the top level should not try to make it.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
