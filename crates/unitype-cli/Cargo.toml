[package]
name = "unitype-cli"
description = "Command-line interface for unitype"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "unitype"
path = "src/main.rs"

[features]
default = []
# Carries the sandbox through to the command, so `unitype run` can reach a
# guest. Off by default: it is a large dependency to build for a capability not
# every workspace uses.
wasm = ["unitype-runtime/wasm"]

[dependencies]
unitype-core.workspace = true
unitype-runtime.workspace = true
unitype-codegen.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
