[package]
name = "unitype-runtime"
description = "Implementation registry, pluggable executors, and policy dispatch for unitype"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
wasm = ["dep:wasmtime"]

[dependencies]
unitype-core.workspace = true
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "process", "io-util", "time"] }
wasmtime = { version = "39", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
